name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install MariaDB Connector/C on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb3 libmariadb-dev pkg-config
      - name: Install MariaDB Connector/C on macOS
        if: runner.os == 'macOS'
        run: |
          brew install mariadb-connector-c pkg-config
          connector_prefix="$(brew --prefix mariadb-connector-c)"
          echo "$connector_prefix/bin" >> "$GITHUB_PATH"
          echo "MARIADB_CONFIG=$connector_prefix/bin/mariadb_config" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$connector_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
      - name: Install MariaDB Connector/C on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'mariadb-connector-c.msi'
          Invoke-WebRequest `
            -Uri 'https://dlm.mariadb.com/4863398/Connectors/c/connector-c-3.4.11/windows-amd64/mariadb-connector-c-3.4.11-win64.msi' `
            -OutFile $msi
          $process = Start-Process msiexec.exe `
            -ArgumentList @('/i', $msi, '/qn', '/norestart') `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Connector/C MSI failed: $($process.ExitCode)" }
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m "not integration"
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - name: Verify native package imports
        run: python -c "import mariadb, mcp, sqlglot; print('native package imports ok')"
